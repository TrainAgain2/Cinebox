name: Sign Cinebox 22 R1.6 120 Hz test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign Cinebox 22 R1.6 120 Hz test APK
    runs-on: ubuntu-latest
    env:
      INPUT_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310519663757505489/xtQHveKtBlspIato.apk
      INPUT_SHA256: b70bb0fa7cee717a3651c06a0bc55be88d3818fc35c4ace4db95dc08063eabce
      CINEBOX_RELEASE_KEYSTORE_B64: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_B64 }}
      CINEBOX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build tools
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager --sdk_root="$ANDROID_SDK_ROOT" 'build-tools;35.0.0'

      - name: Fetch audited unsigned APK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$INPUT_URL" -o unsigned.apk
          test "$(sha256sum unsigned.apk | awk '{print $1}')" = "$INPUT_SHA256"
          test "$(head -c 4 unsigned.apk)" = $'PK\003\004'

      - name: Restore original Cinebox signing key
        run: |
          set -euo pipefail
          test -n "$CINEBOX_RELEASE_KEYSTORE_B64"
          test -n "$CINEBOX_RELEASE_KEYSTORE_PASSWORD"
          export CINEBOX_RELEASE_KEYSTORE_B64 CINEBOX_RELEASE_KEYSTORE_PASSWORD
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ['CINEBOX_RELEASE_KEYSTORE_B64']
          fenced = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', raw, flags=re.DOTALL)
          candidates = [raw, *fenced]
          candidates.extend(re.findall(r'(?:[A-Za-z0-9+/=]\s*){100,}', raw))
          for value in candidates:
              try:
                  data = base64.b64decode(re.sub(r'\s+', '', value), validate=True)
              except Exception:
                  continue
              if data.startswith(b'\xfe\xed\xfe\xed') or data.startswith(b'0\x82'):
                  Path('cinebox-release.jks').write_bytes(data)
                  break
          else:
              raise SystemExit('No valid Cinebox keystore was found.')
          password_raw = os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD']
          blocks = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', password_raw, flags=re.DOTALL)
          password = blocks[-1].strip() if blocks else password_raw.strip()
          if not password:
              raise SystemExit('Empty Cinebox keystore password.')
          Path('signing.env').write_text('STOREPASS=' + password + '\nKEYPASS=' + password + '\n')
          PY
          set -a
          . ./signing.env
          set +a
          keytool -list -keystore cinebox-release.jks -alias cineboxrelease -storepass "$STOREPASS" >/dev/null

      - name: Sign and verify the APK
        run: |
          set -euo pipefail
          set -a
          . ./signing.env
          set +a
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --ks cinebox-release.jks --ks-key-alias cineboxrelease \
            --ks-pass "pass:${STOREPASS}" --key-pass "pass:${KEYPASS}" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out Cinebox-22-Piers-R1.6-120Hz-test.apk unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 Cinebox-22-Piers-R1.6-120Hz-test.apk
          rm -f cinebox-release.jks signing.env unsigned.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinebox-22-Piers-R1.6-120Hz-test-signed
          path: Cinebox-22-Piers-R1.6-120Hz-test.apk
          if-no-files-found: error
          retention-days: 1
