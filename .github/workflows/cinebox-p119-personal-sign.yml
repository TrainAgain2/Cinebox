name: Temporary Cinebox p119 Final Signing

on:
  workflow_dispatch:
    inputs:
      transfer_url:
        description: OIDC-bound temporary transfer URL
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the unsigned p119 APK
        required: true
        type: string
      start_part:
        description: First signed return part to send
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  sign-personal-apk:
    name: Sign p119 privately without artifacts or releases
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CINEBOX_RELEASE_KEYSTORE_B64: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_B64 }}
      CINEBOX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}
      TRANSFER_URL: ${{ inputs.transfer_url }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      START_PART: ${{ inputs.start_part }}
      OIDC_AUDIENCE: cinebox-personal-p119-immediate-sign
    steps:
      - name: Install Android signing tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apksigner
          printf 'APKSIGNER=%s\n' "$(command -v apksigner)" >> "$GITHUB_ENV"

      - name: Obtain restricted OIDC identity
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")
          test -n "$token"
          printf 'OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Download, sign, and return selected p119 chunks
        run: |
          set -euo pipefail
          test -n "$CINEBOX_RELEASE_KEYSTORE_B64"
          test -n "$CINEBOX_RELEASE_KEYSTORE_PASSWORD"
          export KEYSTORE="$RUNNER_TEMP/cinebox-release.jks"
          export STORE_PASSWORD_FILE="$RUNNER_TEMP/cinebox-store.password"
          export KEY_PASSWORD_FILE="$RUNNER_TEMP/cinebox-key.password"
          export CINEBOX_RELEASE_KEYSTORE_B64 CINEBOX_RELEASE_KEYSTORE_PASSWORD
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ['CINEBOX_RELEASE_KEYSTORE_B64']
          candidates = [raw, *re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', raw, flags=re.DOTALL)]
          candidates.extend(re.findall(r'(?:[A-Za-z0-9+/=]\s*){100,}', raw))
          for candidate in candidates:
              try:
                  decoded = base64.b64decode(re.sub(r'\s+', '', candidate), validate=True)
              except Exception:
                  continue
              if decoded.startswith(b'\xfe\xed\xfe\xed'):
                  Path(os.environ['KEYSTORE']).write_bytes(decoded)
                  break
          else:
              raise SystemExit('No valid Cinebox JKS value was found.')
          blocks = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD'], flags=re.DOTALL)
          password = blocks[-1].strip() if blocks else os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD'].strip()
          if not password:
              raise SystemExit('No Cinebox keystore password was found.')
          for name in ('STORE_PASSWORD_FILE', 'KEY_PASSWORD_FILE'):
              path = Path(os.environ[name]); path.write_text(password); path.chmod(0o600)
          PY
          keytool -list -keystore "$KEYSTORE" -alias cineboxrelease -storepass "$(cat "$STORE_PASSWORD_FILE")" >/dev/null
          curl -fsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $OIDC_TOKEN" "$TRANSFER_URL/input" -o "$RUNNER_TEMP/p119-unsigned.apk"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/p119-unsigned.apk" | sha256sum -c -
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias cineboxrelease \
            --ks-pass "file:$STORE_PASSWORD_FILE" --key-pass "file:$KEY_PASSWORD_FILE" \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/p119-signed.apk" "$RUNNER_TEMP/p119-unsigned.apk"
          "$APKSIGNER" verify --verbose --min-sdk-version 28 "$RUNNER_TEMP/p119-signed.apk" >/dev/null
          size=$(stat -c %s "$RUNNER_TEMP/p119-signed.apk")
          chunk_size=$((8 * 1024 * 1024))
          total=$(((size + chunk_size - 1) / chunk_size))
          start="$START_PART"
          test "$start" -ge 0
          test "$start" -lt "$total"
          end=$((start + 35))
          for ((part=start; part<total && part<end; part++)); do
            offset=$((part * chunk_size))
            length=$((size - offset))
            if ((length > chunk_size)); then length=$chunk_size; fi
            chunk="$RUNNER_TEMP/p119-return-${part}.part"
            dd if="$RUNNER_TEMP/p119-signed.apk" of="$chunk" iflag=skip_bytes,count_bytes skip="$offset" count="$length" status=none
            test "$(stat -c %s "$chunk")" = "$length"
            part_sha=$(sha256sum "$chunk" | awk '{print $1}')
            curl -fsS --retry 3 --retry-delay 2 -X PUT -H "Authorization: Bearer $OIDC_TOKEN" -H "X-SHA256: $part_sha" --upload-file "$chunk" "$TRANSFER_URL/output?part=$part&total=$total"
            rm -f "$chunk"
          done
          rm -f "$RUNNER_TEMP/p119-unsigned.apk" "$RUNNER_TEMP/p119-signed.apk" "$KEYSTORE" "$STORE_PASSWORD_FILE" "$KEY_PASSWORD_FILE"

      - name: Confirm private handling
        run: echo 'No APK, backup, release, or artifact was stored on GitHub.'
