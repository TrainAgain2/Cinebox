name: Validate Cinebox Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-signing-key:
    name: Validate persistent Cinebox signing key
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      CINEBOX_RELEASE_KEYSTORE_B64: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_B64 }}
      CINEBOX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the persistent Cinebox signing material
        run: |
          set -euo pipefail
          test -n "$CINEBOX_RELEASE_KEYSTORE_B64"
          test -n "$CINEBOX_RELEASE_KEYSTORE_PASSWORD"
          export CINEBOX_RELEASE_KEYSTORE_B64 CINEBOX_RELEASE_KEYSTORE_PASSWORD
          export KODI_ANDROID_STORE_FILE="$RUNNER_TEMP/cinebox-release.jks"
          export CINEBOX_PASSWORD_FILE="$RUNNER_TEMP/cinebox-release.password"
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ['CINEBOX_RELEASE_KEYSTORE_B64']
          fenced = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', raw, flags=re.DOTALL)
          candidates = [raw, *fenced]
          candidates.extend(re.findall(r'(?:[A-Za-z0-9+/=]\s*){100,}', raw))
          for candidate in candidates:
              try:
                  decoded = base64.b64decode(re.sub(r'\s+', '', candidate), validate=True)
              except Exception:
                  continue
              if decoded.startswith(b'\xfe\xed\xfe\xed'):
                  Path(os.environ['KODI_ANDROID_STORE_FILE']).write_bytes(decoded)
                  break
          else:
              raise SystemExit('No valid Cinebox JKS value was found in CINEBOX_RELEASE_KEYSTORE_B64.')

          password_raw = os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD']
          password_blocks = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', password_raw, flags=re.DOTALL)
          password = password_blocks[-1].strip() if password_blocks else password_raw.strip()
          if not password:
              raise SystemExit('No Cinebox keystore password was found.')
          password_file = Path(os.environ['CINEBOX_PASSWORD_FILE'])
          password_file.write_text(password)
          password_file.chmod(0o600)
          PY
          keytool -list \
            -keystore "$KODI_ANDROID_STORE_FILE" \
            -alias cineboxrelease \
            -storepass "$(cat "$CINEBOX_PASSWORD_FILE")" >/dev/null
          rm -f "$CINEBOX_PASSWORD_FILE" "$KODI_ANDROID_STORE_FILE"
          echo 'Cinebox signing key validation passed.'
