name: Temporary Cinebox 22 R1.7 Signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign-r17-apk:
    name: Sign Cinebox 22 R1.7 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      INPUT_URL: https://files.manuscdn.com/user_upload_by_module/session_file/310519663757505489/wIlGOwWSCZaBNVnu.apk
      INPUT_SHA256: fe1911f565e70502f4b0ac8ac02868e9b3c61fe296002a090bfa4c5474ff33e1
      CINEBOX_RELEASE_KEYSTORE_B64: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_B64 }}
      CINEBOX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" 'build-tools;35.0.0'
      - name: Fetch audited unsigned APK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$INPUT_URL" -o unsigned.apk
          test "$(sha256sum unsigned.apk | awk '{print $1}')" = "$INPUT_SHA256"
          test "$(head -c 4 unsigned.apk)" = $'PK\003\004'
      - name: Restore original Cinebox signing key
        run: |
          set -euo pipefail
          test -n "$CINEBOX_RELEASE_KEYSTORE_B64"
          test -n "$CINEBOX_RELEASE_KEYSTORE_PASSWORD"
          export CINEBOX_RELEASE_KEYSTORE_B64 CINEBOX_RELEASE_KEYSTORE_PASSWORD
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          raw = os.environ['CINEBOX_RELEASE_KEYSTORE_B64']
          fenced = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', raw, flags=re.DOTALL)
          candidates = [raw, *fenced]
          candidates.extend(re.findall(r'(?:[A-Za-z0-9+/=]\s*){100,}', raw))
          for candidate in candidates:
              try:
                  decoded = base64.b64decode(re.sub(r'\s+', '', candidate), validate=True)
              except Exception:
                  continue
              if decoded.startswith(b'\xfe\xed\xfe\xed'):
                  Path('cinebox-release.jks').write_bytes(decoded)
                  break
          else:
              raise SystemExit('No valid Cinebox keystore was found.')
          password_raw = os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD']
          password_blocks = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', password_raw, flags=re.DOTALL)
          password = password_blocks[-1].strip() if password_blocks else password_raw.strip()
          if not password:
              raise SystemExit('No Cinebox keystore password was found.')
          Path('signing.env').write_text('STOREPASS=' + password + '\nKEYPASS=' + password + '\n')
          PY
          set -a
          . ./signing.env
          set +a
          keytool -list -keystore cinebox-release.jks -alias cineboxrelease -storepass "$STOREPASS" >/dev/null
      - name: Sign and verify the APK
        run: |
          set -euo pipefail
          set -a
          . ./signing.env
          set +a
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --ks cinebox-release.jks --ks-key-alias cineboxrelease \
            --ks-pass "pass:${STOREPASS}" --key-pass "pass:${KEYPASS}" \
            --out Cinebox-22-Piers-R1.7-repos-compativeis.apk unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 Cinebox-22-Piers-R1.7-repos-compativeis.apk
          rm -f cinebox-release.jks signing.env unsigned.apk
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinebox-22-Piers-R1.7-repos-compativeis-signed
          path: Cinebox-22-Piers-R1.7-repos-compativeis.apk
          if-no-files-found: error
          retention-days: 1
