name: Build Cinebox Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinebox-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Build arm64-v8a test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 21.4.7075529
      BUILD_JOBS: 2

    steps:
      - name: Check out Cinebox Omega
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake bison build-essential ca-certificates cmake curl \
            flex gawk gettext git gperf lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev libgmp-dev liblzo2-dev libssl-dev libtool \
            libtool-bin make meson nasm ninja-build pkg-config python3 unzip \
            yasm zip zlib1g-dev

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Expose the SDK path expected by Kodi Omega
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$tools_dir"
          ln -sfn "$tools_dir" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Create a test signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Restore downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: .cache/kodi-tarballs
          key: cinebox-android-tarballs-arm64-${{ hashFiles('tools/depends/**') }}
          restore-keys: |
            cinebox-android-tarballs-arm64-

      - name: Build dependencies for Android arm64-v8a
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cache/kodi-tarballs" "$RUNNER_TEMP/cinebox-depends"
          cd tools/depends
          ./bootstrap
          ./configure \
            --with-tarballs="$GITHUB_WORKSPACE/.cache/kodi-tarballs" \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            --prefix="$RUNNER_TEMP/cinebox-depends" \
            --disable-ccache
          make -j"$BUILD_JOBS"

      - name: Configure Cinebox
        run: |
          set -euo pipefail
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$GITHUB_WORKSPACE/build-android"

      - name: Compile Cinebox and package the APK
        run: |
          set -euo pipefail
          make -C "$GITHUB_WORKSPACE/build-android" -j"$BUILD_JOBS"
          make -C "$GITHUB_WORKSPACE/build-android" apk

      - name: Collect the installable APK
        run: |
          set -euo pipefail
          mkdir -p release
          apk_path="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'cineboxapp-aarch64-*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" release/Cinebox-Omega-arm64-v8a-test.apk
          sha256sum release/Cinebox-Omega-arm64-v8a-test.apk > release/SHA256SUMS.txt
          cat > release/README.txt <<'EOF'
          Cinebox Omega Android test APK

          This APK is compiled from the Cinebox Omega branch and uses the
          package ID io.github.trainagain2.cinebox. It is signed with a test
          debug key and is intended for direct sideloading on compatible
          Android and Android TV devices.
          EOF

      - name: Upload APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: Cinebox-Omega-Android-APK
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish a prerelease with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="cinebox-omega-build-${{ github.run_number }}"
          gh release create "$tag" \
            release/Cinebox-Omega-arm64-v8a-test.apk \
            release/SHA256SUMS.txt \
            release/README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cinebox Omega test build ${{ github.run_number }}" \
            --notes "Android arm64-v8a test APK built automatically from the Omega branch. Verify the SHA-256 checksum before sideloading." \
            --prerelease
