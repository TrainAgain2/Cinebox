name: Build Cinebox Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinebox-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm:
    name: Build ${{ matrix.abi }} APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
          - abi: armeabi-v7a
            host: arm-linux-androideabi
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      # NDK r27 supports Android 5.0. 16 KB ELF alignment is added explicitly
      # by the Cinebox Android toolchain for Android 16 compatibility.
      ANDROID_NDK_VERSION: 27.3.13750724
      BUILD_JOBS: 2

    steps:
      - name: Check out Cinebox Omega
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake bison build-essential ca-certificates cmake curl \
            flex gawk gettext git gperf lib32stdc++6 lib32z1 lib32z1-dev \
            libcurl4-openssl-dev libgmp-dev liblzo2-dev libssl-dev libtool \
            libtool-bin make meson nasm ninja-build pkg-config python3 unzip \
            yasm zip zlib1g-dev

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Expose the SDK path expected by Kodi Omega
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$tools_dir"
          ln -sfn "$tools_dir" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Create a temporary signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keypass android \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Restore downloaded source tarballs
        uses: actions/cache@v4
        with:
          path: .cache/kodi-tarballs
          key: cinebox-android-tarballs-${{ matrix.abi }}-${{ hashFiles('tools/depends/**') }}
          restore-keys: |
            cinebox-android-tarballs-${{ matrix.abi }}-

      - name: Build dependencies for Android ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cache/kodi-tarballs" "$RUNNER_TEMP/cinebox-depends-${{ matrix.abi }}"
          cd tools/depends
          ./bootstrap
          # Keep the universal APK compatible with Android 5.0 / API 21.
          ./configure \
            --with-tarballs="$GITHUB_WORKSPACE/.cache/kodi-tarballs" \
            --host=${{ matrix.host }} \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            --with-ndk-api=21 \
            --prefix="$RUNNER_TEMP/cinebox-depends-${{ matrix.abi }}" \
            --disable-ccache
          make -j"$BUILD_JOBS"

      - name: Configure Cinebox for ${{ matrix.abi }}
        run: |
          set -euo pipefail
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$GITHUB_WORKSPACE/build-android-${{ matrix.abi }}"

      - name: Compile Cinebox and package the ${{ matrix.abi }} APK
        run: |
          set -euo pipefail
          make -C "$GITHUB_WORKSPACE/build-android-${{ matrix.abi }}" -j"$BUILD_JOBS"
          make -C "$GITHUB_WORKSPACE/build-android-${{ matrix.abi }}" apk

      - name: Package the ${{ matrix.abi }} Gradle workspace
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C "$GITHUB_WORKSPACE/build-android-${{ matrix.abi }}/tools/android" \
            -czf "out/cinebox-packaging-${{ matrix.abi }}.tar.gz" packaging

      - name: Upload the ${{ matrix.abi }} Gradle workspace
        uses: actions/upload-artifact@v4
        with:
          name: cinebox-packaging-${{ matrix.abi }}
          path: out/cinebox-packaging-${{ matrix.abi }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  assemble-universal:
    name: Assemble universal ARM APK
    needs: build-arm
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_VERSION: 27.3.13750724
      KODI_ANDROID_STORE_FILE: ${{ github.workspace }}/cinebox-release.jks
      KODI_ANDROID_STORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}
      KODI_ANDROID_KEY_ALIAS: cineboxrelease
      KODI_ANDROID_KEY_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}

    steps:
      - name: Check out Cinebox release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Expose the Android SDK command-line tools
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$tools_dir"
          ln -sfn "$tools_dir" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Restore the persistent Cinebox signing key
        env:
          CINEBOX_RELEASE_KEYSTORE_B64: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_B64 }}
          CINEBOX_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.CINEBOX_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CINEBOX_RELEASE_KEYSTORE_B64"
          test -n "$CINEBOX_RELEASE_KEYSTORE_PASSWORD"
          export CINEBOX_RELEASE_KEYSTORE_B64 CINEBOX_RELEASE_KEYSTORE_PASSWORD KODI_ANDROID_STORE_FILE
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ['CINEBOX_RELEASE_KEYSTORE_B64']
          fenced = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', raw, flags=re.DOTALL)
          candidates = [raw, *fenced]
          candidates.extend(re.findall(r'(?:[A-Za-z0-9+/=]\s*){100,}', raw))

          for candidate in candidates:
              try:
                  decoded = base64.b64decode(re.sub(r'\s+', '', candidate), validate=True)
              except Exception:
                  continue
              if decoded.startswith(b'\xfe\xed\xfe\xed'):
                  Path(os.environ['KODI_ANDROID_STORE_FILE']).write_bytes(decoded)
                  break
          else:
              raise SystemExit('No valid Cinebox JKS value was found in CINEBOX_RELEASE_KEYSTORE_B64.')

          password_raw = os.environ['CINEBOX_RELEASE_KEYSTORE_PASSWORD']
          password_blocks = re.findall(r'```(?:[A-Za-z]+)?\s*(.*?)```', password_raw, flags=re.DOTALL)
          password = password_blocks[-1].strip() if password_blocks else password_raw.strip()
          if not password:
              raise SystemExit('No Cinebox keystore password was found.')
          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a') as stream:
              stream.write(f'KODI_ANDROID_STORE_PASSWORD={password}\n')
              stream.write(f'KODI_ANDROID_KEY_PASSWORD={password}\n')
          os.environ['CINEBOX_PARSED_PASSWORD'] = password
          PY
          KODI_ANDROID_STORE_PASSWORD="$(tail -n 2 "$GITHUB_ENV" | head -n 1 | cut -d= -f2-)"
          keytool -list \
            -keystore "$KODI_ANDROID_STORE_FILE" \
            -alias "$KODI_ANDROID_KEY_ALIAS" \
            -storepass "$KODI_ANDROID_STORE_PASSWORD" >/dev/null

      - name: Download the arm64 Gradle workspace
        uses: actions/download-artifact@v4
        with:
          name: cinebox-packaging-arm64-v8a
          path: artifacts/arm64-v8a

      - name: Download the arm32 Gradle workspace
        uses: actions/download-artifact@v4
        with:
          name: cinebox-packaging-armeabi-v7a
          path: artifacts/armeabi-v7a

      - name: Assemble both ARM libraries with Gradle
        run: |
          set -euo pipefail
          mkdir -p universal/arm64 universal/arm32 release
          tar -xzf artifacts/arm64-v8a/cinebox-packaging-arm64-v8a.tar.gz -C universal/arm64
          tar -xzf artifacts/armeabi-v7a/cinebox-packaging-armeabi-v7a.tar.gz -C universal/arm32
          arm64_workspace="$GITHUB_WORKSPACE/universal/arm64/packaging"
          arm32_workspace="$GITHUB_WORKSPACE/universal/arm32/packaging"
          test -d "$arm64_workspace/xbmc/lib/arm64-v8a"
          test -d "$arm32_workspace/xbmc/lib/armeabi-v7a"
          rm -rf "$arm64_workspace/xbmc/lib/armeabi-v7a"
          cp -a "$arm32_workspace/xbmc/lib/armeabi-v7a" "$arm64_workspace/xbmc/lib/"
          test "$(find "$arm64_workspace/xbmc/lib/arm64-v8a" -type f -name '*.so' | wc -l)" -gt 0
          test "$(find "$arm64_workspace/xbmc/lib/armeabi-v7a" -type f -name '*.so' | wc -l)" -gt 0
          rm -rf "$arm64_workspace/xbmc/build"
          (
            cd "$arm64_workspace"
            ./gradlew --no-daemon clean assembleDebug
          )
          apk_path="$(find "$arm64_workspace/xbmc/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" release/Cinebox-Omega-universal-arm32-arm64-test.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 release/Cinebox-Omega-universal-arm32-arm64-test.apk

      - name: Verify Android 16 native-library compatibility
        run: |
          set -euo pipefail
          apk="release/Cinebox-Omega-universal-arm32-arm64-test.apk"
          verifier="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$verifier"

          rm -rf verify-16kb
          mkdir -p verify-16kb
          unzip -qq "$apk" 'lib/arm64-v8a/*.so' -d verify-16kb

          export verifier
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          failures = []
          for library in sorted(Path('verify-16kb/lib/arm64-v8a').glob('*.so')):
              result = subprocess.run(
                  [os.environ['verifier'], '-lW', str(library)],
                  check=True, text=True, capture_output=True)
              loads = []
              relro = None
              for line in result.stdout.splitlines():
                  fields = line.split()
                  if not fields:
                      continue
                  if fields[0] == 'LOAD':
                      loads.append(int(fields[-1], 16))
                  elif fields[0] == 'GNU_RELRO':
                      relro = (int(fields[2], 16), int(fields[5], 16))
              if not loads or any(alignment != 0x4000 for alignment in loads):
                  failures.append(f'{library}: LOAD segments are not 16 KB aligned')
              if relro and (relro[0] + relro[1]) % 0x4000:
                  failures.append(f'{library}: GNU_RELRO is not 16 KB aligned')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('All ARM64 Cinebox libraries are 16 KB ELF aligned.')
          PY

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"

      - name: Verify both ARM ABIs in the APK
        run: |
          set -euo pipefail
          unzip -l release/Cinebox-Omega-universal-arm32-arm64-test.apk | tee release/APK_CONTENTS.txt
          grep -q 'lib/arm64-v8a/.*\.so' release/APK_CONTENTS.txt
          grep -q 'lib/armeabi-v7a/.*\.so' release/APK_CONTENTS.txt
          sha256sum release/Cinebox-Omega-universal-arm32-arm64-test.apk > release/SHA256SUMS.txt
          cat > release/README.txt <<'EOF'
          Cinebox Omega universal ARM Android test APK

          This APK contains native libraries for both 64-bit ARM (arm64-v8a)
          and 32-bit ARM (armeabi-v7a) Android and Android TV devices. Android
          selects the appropriate libraries when installing it. Intel x86 and
          x86_64 devices are not included.

          Android 16 compatibility: ARM64 native libraries are built and APK-
          aligned for 16 KB page-size devices.

          The APK is signed with the persistent Cinebox release key, so later
          Cinebox updates signed with the same key install over this version.
          EOF

      - name: Upload the universal APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: Cinebox-Omega-universal-ARM-APK
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the universal ARM prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="cinebox-omega-build-${{ github.run_number }}"
          version_file="$GITHUB_WORKSPACE/version.txt"
          version_major="$(awk '$1 == "VERSION_MAJOR" { print $2 }' "$version_file")"
          version_minor="$(awk '$1 == "VERSION_MINOR" { print $2 }' "$version_file")"
          version_tag="$(awk '$1 == "VERSION_TAG" { print $2 }' "$version_file")"
          test -n "$version_major"
          test -n "$version_minor"
          release_version="${version_major}.${version_minor}"
          if [ -n "$version_tag" ]; then
            release_version="${release_version}-${version_tag}"
          fi
          gh release create "$tag" \
            release/Cinebox-Omega-universal-arm32-arm64-test.apk \
            release/SHA256SUMS.txt \
            release/README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cinebox ${release_version} - Universal ARM" \
            --notes "Cinebox ${release_version} universal ARM update. Includes armeabi-v7a (32-bit) and arm64-v8a (64-bit) libraries, with Android 16 16 KB page-size compatibility validated before publication. Verify the SHA-256 checksum before sideloading."
